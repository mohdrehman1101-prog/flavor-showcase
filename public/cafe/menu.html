<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Cafe Menu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

  <!-- ================= HOME ================= -->

  <main id="home">

    <header class="top">

      <div class="logo">☕</div>

      <div>
        <h1>Coffee House</h1>
        <p>Good coffee. Good mood.</p>
      </div>

    </header>


    <!-- ================= SEARCH ================= -->

    <div class="search">

      <span>⌕</span>

      <input
        id="search"
        type="text"
        placeholder="Search here..."
      >

    </div>


    <!-- ================= NEW MENU ================= -->

    <section class="section">

      <div class="title-row">

        <h2>New Menu</h2>

        <button onclick="showAll()">
          View All
        </button>

      </div>

      <div
        class="products"
        id="products">
      </div>

    </section>


    <!-- ================= SPECIAL ================= -->

    <section class="special">

      <div class="special-circle"></div>

      <div class="special-text">

        <small>Special</small>

        <h1 id="specialName">
          Classic<br>
          Coffee
        </h1>

        <p id="specialPrice">
          $11.00
        </p>

      </div>


      <div class="special-main">

        <img
          id="specialImage"
          src="https://i.ibb.co/6RMtN9g8/1788631707612.png"
          alt="Special Coffee">

      </div>


      <div class="floating-drinks">

        <button onclick="special(0)">
          <img src="https://i.ibb.co/6RMtN9g8/1788631707612.png">
        </button>

        <button onclick="special(1)">
          <img src="https://i.ibb.co/KczwKC4b/pngtree-flying-cup-of-coffee-with-splash-and-png-image-12831547.png">
        </button>

        <button onclick="special(2)">
          <img src="https://i.ibb.co/s9Pb3PXV/1788629659554.png">
        </button>

      </div>

    </section>


    <!-- ================= MENU ================= -->

    <section
      class="menu-section"
      id="menuSection">

      <div class="menu-heading">

        <h2>Restaurant Menu</h2>

        <p>
          Choose your favourite food
        </p>

      </div>


      <!-- CATEGORY -->

      <div
        class="category-nav"
        id="categoryNav">

        <button
          class="category active"
          onclick="filterCategory('all', this)">
          All
        </button>

        <button
          class="category"
          onclick="filterCategory('veg', this)">
          🥗 Veg
        </button>

        <button
          class="category"
          onclick="filterCategory('nonveg', this)">
          🍗 Non-Veg
        </button>

        <button
          class="category"
          onclick="filterCategory('drinks', this)">
          🥤 Drinks
        </button>

      </div>


      <!-- MENU ITEMS -->

      <div id="catalogue"></div>

    </section>

  </main>


  <!-- ================= DETAILS ================= -->

  <section
    class="details"
    id="details">

    <header class="details-header">

      <button onclick="closeDetails()">
        ←
      </button>

      <h2>Details</h2>

      <button onclick="toggleFavourite()">
        ♡
      </button>

    </header>


    <div class="details-blue">

      <div class="details-info">

        <h1 id="detailName">
          Classic Coffee
        </h1>

        <div class="rating">
          ★★★★★
          <span>4.8</span>
        </div>

        <h3>
          Description
        </h3>

        <p id="detailDescription">
          Freshly prepared coffee with a rich aroma and smooth taste.
        </p>

        <div
          class="detail-view-price"
          id="detailPrice">
          $11.00
        </div>

      </div>


      <img
        id="detailImage"
        src="https://i.ibb.co/6RMtN9g8/1788631707612.png"
        alt="Coffee">

    </div>

  </section>


  <!-- ================= TOAST ================= -->

  <div
    class="toast"
    id="toast">
    Done
  </div>

</div>


<script src="script.js"></script>

</body>
</html>
