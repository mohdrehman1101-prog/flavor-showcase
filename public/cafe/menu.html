<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Cafe Menu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

  <!-- ================= HOME ================= -->

  <main id="home">

    <header class="top">

      <div class="logo">☕</div>

      <div>
        <h1>Bake ñ Love</h1>
        <p>Good coffee. Good mood.</p>
      </div>

    </header>


    <!-- ================= SEARCH ================= -->

    <div class="search">

      <span>⌕</span>

      <input
        id="search"
        type="text"
        placeholder="Search here..."
      >

    </div>


    <!-- ================= NEW MENU ================= -->

    <section class="section">

      <div class="title-row">

        <h2>New Menu</h2>

        <button onclick="showAll()">
          View All
        </button>

      </div>

      <div
        class="products"
        id="products">
      </div>

    </section>


    <!-- ================= SPECIAL ================= -->

    <section class="special">

      <div class="special-circle"></div>

      <div class="special-text">

        <small>Special</small>

        <h1 id="specialName">
          Triple Cheese<br>
          Pizza
        </h1>

        <p id="specialPrice">
          ₹199
        </p>

      </div>


      <div class="special-main">

        <img
          id="specialImage"
          src="/__l5e/assets-v1/e44e8046-29ec-4df5-9236-ff474aa5e936/Tripple Cheese Pizza.png"
          alt="Triple Cheese Pizza">

      </div>


      <div class="floating-drinks">

        <button onclick="special(0)">
          <img src="/__l5e/assets-v1/e44e8046-29ec-4df5-9236-ff474aa5e936/Tripple Cheese Pizza.png">
        </button>

        <button onclick="special(1)">
          <img src="/__l5e/assets-v1/722906d6-1ce1-4327-836a-9e74a3f60a21/Vegetable Verona Pizza.png">
        </button>

        <button onclick="special(2)">
          <img src="/__l5e/assets-v1/030701b9-74cf-4bb1-a918-1d1c22bcc333/Cheese Corn Pizza.png">
        </button>

      </div>

    </section>


    <!-- ================= MENU ================= -->

    <section
      class="menu-section"
      id="menuSection">

      <div class="menu-heading">

        <h2>Restaurant Menu</h2>

        <p>
          Choose your favourite food
        </p>

      </div>


      <!-- CATEGORY -->

      <div
        class="category-nav"
        id="categoryNav">

        <button
          class="category active"
          onclick="filterCategory('all', this)">
          All
        </button>

        <button
          class="category"
          onclick="filterCategory('veg', this)">
          🥗 Veg
        </button>

        <button
          class="category"
          onclick="filterCategory('nonveg', this)">
          🍗 Non-Veg
        </button>

        <button
          class="category"
          onclick="filterCategory('drinks', this)">
          🥤 Drinks
        </button>

      </div>


      <!-- MENU ITEMS -->

      <div id="catalogue"></div>

    </section>

  </main>


  <!-- ================= DETAILS ================= -->

  <section
    class="details"
    id="details">

    <header class="details-header">

      <button onclick="closeDetails()">
        ←
      </button>

      <h2>Details</h2>

      <button onclick="toggleFavourite()">
        ♡
      </button>

    </header>


    <div class="details-blue">

      <div class="details-info">

        <h1 id="detailName">
          Triple Cheese Pizza
        </h1>

        <div class="rating">
          ★★★★★
          <span>4.8</span>
        </div>

        <h3>
          Description
        </h3>

        <p id="detailDescription">
          
        </p>

        <div
          class="detail-view-price"
          id="detailPrice">
          ₹199
        </div>

      </div>


      <img
        id="detailImage"
        src="/__l5e/assets-v1/e44e8046-29ec-4df5-9236-ff474aa5e936/Tripple Cheese Pizza.png"
        alt="Triple Cheese Pizza">

    </div>

  </section>


  <!-- ================= TOAST ================= -->

  <div
    class="toast"
    id="toast">
    Done
  </div>

</div>


<script src="script.js"></script>

</body>
</html>
